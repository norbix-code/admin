version: 2
updates:
  # npm dependencies — weekly, grouped to keep PR noise low.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      redux:
        patterns: ['@reduxjs/toolkit', 'react-redux', 'redux-persist']
      tooling:
        patterns:
          - 'vite'
          - '@vitejs/*'
          - 'typescript'
          - 'typescript-eslint'
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'vitest'
          - 'tailwindcss'
          - 'postcss'
          - 'autoprefixer'

  # GitHub Actions versions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /deployments
    schedule:
      interval: weekly
