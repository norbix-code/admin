name: Production · Build & Deploy

# Release build of the ADMIN portal for the Managed Service production box
# (norbix.ai, Hostinger k3s). Same tag convention as gateway/cloud release.yml:
#
#   push a tag  ms-v2.1.0  → build `admin:2.1.0` (linux/amd64 + linux/arm64)
#                            → dispatch `production-deploy` to codemash-io/devops
#   Actions → Run workflow → pick the version
#
# Recommended flow: staging-ms-v2.1.0 (staging.yml, staging box) → verify →
# ms-v2.1.0 on the SAME commit → production. devops records the image in
# production/versions.yaml and applies the production workspace behind the
# GitHub Environment `production` (required reviewers).
#
# The image is the same build for every edition (the portal reads the edition
# at runtime from the Hub's /echo). NOTE: the managed overlay in devops does
# not deploy admin yet (admin.yaml commented out) — until it does, the record
# is kept and the deploy's `set image` for admin is a no-op.
#
# The dispatch is OFF until the repository variable PRODUCTION_DEPLOY_ENABLED
# is "true" (the build still runs and pushes).
#
# Secrets: AWS_ROLE_ARN, DEVOPS_DISPATCH_TOKEN, COSIGN_PRIVATE_KEY,
# COSIGN_PASSWORD — the same ones staging.yml uses. The image is signed by
# digest with the Norbix cosign key; without the cosign secrets it is pushed
# unsigned with a warning — and production (image_verification = strict)
# then refuses it.
# Variable: ECR_REGISTRY (optional — falls back to the norbix account registry)

on:
  push:
    tags: ['ms-v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 2.1.0) — becomes the image tag admin:<version>'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.p.outputs.version }}
    steps:
      - id: p
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#ms-v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Version '$VERSION' is not X.Y.Z[-suffix]"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building admin:$VERSION"

  build-push:
    needs: plan
    runs-on: ubuntu-22.04
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU (arm64 build on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: ref
        run: |
          REGISTRY="${{ vars.ECR_REGISTRY }}"
          [ -z "$REGISTRY" ] && REGISTRY="${{ steps.ecr.outputs.registry }}"
          echo "image_ref=$REGISTRY/norbix/admin:${{ needs.plan.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ref.outputs.image_ref }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production

      # ── cosign: sign the pushed image BY DIGEST with the Norbix key ───
      # ONE key for every Norbix image (canonical public key: devops
      # release/cosign.pub; this repo's copy: security/cosign.pub). Signed by
      # IMMUTABLE DIGEST, so the signature covers exactly the bytes just
      # pushed, whatever tags point at them. The installs (devops
      # terraform/hostinger, self-hosted/terraform) verify it with cosign v3
      # and deploy that digest.
      # No secrets in this repo → the image is pushed UNSIGNED with a warning
      # (nothing breaks before the owner adds them): staging
      # (image_verification = warn) still deploys it, production (strict)
      # refuses it.
      - name: Check signing secrets
        id: signing
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$COSIGN_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Image not signed::Secrets COSIGN_PRIVATE_KEY / COSIGN_PASSWORD are not set in this repo — the image was pushed UNSIGNED. Staging (image_verification = warn) still deploys it; production (strict) refuses it."
          fi

      # cosign v3.1.3, pinned with its sha256 — the same binary the installs
      # verify with (devops self-hosted/terraform/scripts/install-cosign.sh;
      # move both together). A direct download instead of
      # sigstore/cosign-installer: no floating action tag to break the job.
      - name: Install cosign v3.1.3 (sha256 checked)
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/cosign \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          rm -f /tmp/cosign
          cosign version | grep GitVersion

      - name: Sign image with cosign (by digest) and verify
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REF%:*}"   # image_ref carries the tag; sign <repo>@<digest>
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the build step returned no digest ('$IMAGE_DIGEST') — nothing to sign"; exit 1; }
          # The key must be THE Norbix key: its public half = security/cosign.pub
          # (otherwise every install would reject the signature).
          if [ "$(cosign public-key --key env://COSIGN_PRIVATE_KEY | tr -d '[:space:]')" != "$(tr -d '[:space:]' < security/cosign.pub)" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not the Norbix key: its public half differs from security/cosign.pub (devops release/cosign.pub)"
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}@${IMAGE_DIGEST}"
          cosign verify --key security/cosign.pub "${IMAGE_REF}@${IMAGE_DIGEST}" > /dev/null
          echo "Signed and verified ${IMAGE_REF}@${IMAGE_DIGEST}"
          echo "- signed \`${IMAGE_REF}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  notify-devops:
    name: Trigger production deploy
    needs: [plan, build-push]
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Send repository_dispatch to devops
        env:
          TOKEN: ${{ secrets.DEVOPS_DISPATCH_TOKEN }}
          IMAGE: ${{ needs.build-push.outputs.image_ref }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
        run: |
          # digest = what was pushed and signed; production verifies it (strict)
          PAYLOAD=$(jq -n \
            --arg i "$IMAGE" --arg d "$DIGEST" \
            --arg sha "${{ github.sha }}" --arg branch "${{ github.ref_name }}" \
            '{ event_type: "production-deploy",
               client_payload: { release: "managed", source: "admin", sha: $sha, branch: $branch,
                                 services: [ { name: "admin", image: $i, digest: $d } ] } }')
          echo "$PAYLOAD" | jq .

          STATUS=$(curl -s --http1.1 --retry 5 --retry-delay 5 -o /tmp/dispatch-resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/codemash-io/devops/dispatches \
            -d "$PAYLOAD")
          if [ "$STATUS" != "204" ]; then
            echo "GitHub answered HTTP $STATUS:"; cat /tmp/dispatch-resp.txt
            echo "::error::Dispatch rejected (HTTP $STATUS). Check DEVOPS_DISPATCH_TOKEN (expired? Contents: Read and write on codemash-io/devops?)"
            exit 1
          fi
          echo "devops notified — approve 'Production · Deploy' in codemash-io/devops (environment production)"
