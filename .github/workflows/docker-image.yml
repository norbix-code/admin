name: Docker image

on:
  # Manual only — ordinary pushes/PRs no longer docker-build. The staging
  # tag flow (staging.yml) and release tags build the real images and
  # catch Dockerfile breakage where it matters.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One build serves every edition (managed, enterprise, community): the
      # edition is read at runtime from the Hub's /echo, not at build time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          push: false
          load: true
          tags: norbix/admin:ci

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: norbix/admin:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
