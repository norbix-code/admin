name: CodeQL

on:
  # Monthly deep scan (1st of month, 06:00 UTC) + on-demand runs.
  # Was: every PR/push — the ~20-min autobuild on each push cost far
  # more than it caught. Dependabot still opens security PRs the moment
  # a CVE lands, independent of this schedule.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
