name: Staging · Build & Deploy

# Continuous deployment of the ADMIN portal to the staging box (Hostinger, k3s).
#
# This workflow stages managed + enterprise only. The self-hosted
# community-admin image is the SAME build (the edition is decided at runtime
# from the Hub's /echo `release`, never at build time) and is not staged here,
# so the triggers are:
#
#   push a tag  staging-ms-v2.1.0   → build `admin` (ManagedService) → deploy to norbix-ms
#   push a tag  staging-ent-v2.1.0  → build `enterprise-admin` (Enterprise) → deploy to norbix-enterprise
#   Actions → Run workflow          → pick the release
#
# Same tag convention as gateway/cloud (staging- + the release.yml prefixes).
# Image tag becomes staging-<version>.<short-sha> — readable + unique for
# ECR's immutable tags.
#
# Unlike gateway/cloud this repo has no _reusable-build-push.yml, so the
# build steps are inline (same buildx + OIDC ECR login pattern).
#
# Secrets: AWS_ROLE_ARN            — arn:aws:iam::539262298114:role/github-actions-norbix
#                                    NOTE: that role's trust policy must include
#                                    "repo:norbix-code/admin:*" (this repo is in a
#                                    different org than gateway/cloud!)
#          DEVOPS_DISPATCH_TOKEN   — fine-grained PAT for codemash-io/devops,
#                                    Contents: Read and write
#          COSIGN_PRIVATE_KEY,     — the Norbix cosign key + its password: the
#          COSIGN_PASSWORD           image is signed by digest (public key
#                                    security/cosign.pub). Optional: without
#                                    them it is pushed unsigned (warning).
# Variable: ECR_REGISTRY (optional — falls back to the norbix account registry)

on:
  push:
    tags: ['staging-*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Release to build & deploy (community-admin is not staged here)'
        required: true
        default: 'managed'
        type: choice
        options: [managed, enterprise]

permissions:
  id-token: write
  contents: read

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      release: ${{ steps.p.outputs.release }}
      version: ${{ steps.p.outputs.version }}
      flavor: ${{ steps.p.outputs.flavor }}
      image: ${{ steps.p.outputs.image }}
    steps:
      - id: p
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="${{ github.ref_name }}"
          VERSION=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "$TAG" in
              staging-enterprise-*)  RELEASE=enterprise ; VERSION="${TAG#staging-enterprise-}" ;;
              staging-ent-*)         RELEASE=enterprise ; VERSION="${TAG#staging-ent-}" ;;
              staging-managed-*)     RELEASE=managed    ; VERSION="${TAG#staging-managed-}" ;;
              staging-ms-*)          RELEASE=managed    ; VERSION="${TAG#staging-ms-}" ;;
              staging-self-hosted-*|staging-sh-*)
                echo "::notice::Admin self-hosted (community-admin) is not staged by this workflow — nothing to build for '$TAG'."
                echo "release=skip" >> "$GITHUB_OUTPUT"; exit 0 ;;
              *) echo "::error::Tag '$TAG' must look like staging-<ms|ent>-v<X.Y.Z>"; exit 1 ;;
            esac
          else
            RELEASE="${{ inputs.release }}"
          fi
          case "$RELEASE" in
            managed)    FLAVOR=ManagedService ; IMAGE=admin ;;
            enterprise) FLAVOR=Enterprise     ; IMAGE=enterprise-admin ;;
          esac
          if [ -n "$VERSION" ]; then
            IMGTAG="staging-${VERSION#v}.$SHORT"
          else
            IMGTAG="staging-$SHORT"
          fi
          echo "release=$RELEASE"  >> "$GITHUB_OUTPUT"
          echo "version=$IMGTAG"   >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR"    >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE"      >> "$GITHUB_OUTPUT"
          echo "Building $RELEASE ($FLAVOR) → $IMAGE:$IMGTAG"

  build-push:
    needs: plan
    if: needs.plan.outputs.release != 'skip'
    runs-on: ubuntu-22.04
    outputs:
      image_ref: ${{ steps.ref.outputs.image_ref }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-2

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image reference
        id: ref
        run: |
          REGISTRY="${{ vars.ECR_REGISTRY }}"
          [ -z "$REGISTRY" ] && REGISTRY="${{ steps.ecr.outputs.registry }}"
          echo "image_ref=$REGISTRY/norbix/${{ needs.plan.outputs.image }}:${{ needs.plan.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build and push (amd64 — staging box arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.image_ref }}
          # No edition build arg: the Dockerfile has none and the portal reads
          # the edition at runtime (/echo `release`), so every flavour is the
          # same build. `flavor` only scopes the cache.
          cache-from: type=gha,scope=staging-${{ needs.plan.outputs.flavor }}
          cache-to: type=gha,mode=max,scope=staging-${{ needs.plan.outputs.flavor }}

      # ── cosign: sign the pushed image BY DIGEST with the Norbix key ───
      # ONE key for every Norbix image (canonical public key: devops
      # release/cosign.pub; this repo's copy: security/cosign.pub). Signed by
      # IMMUTABLE DIGEST, so the signature covers exactly the bytes just
      # pushed, whatever tags point at them. The installs (devops
      # terraform/hostinger, self-hosted/terraform) verify it with cosign v3
      # and deploy that digest.
      # No secrets in this repo → the image is pushed UNSIGNED with a warning
      # (nothing breaks before the owner adds them): staging
      # (image_verification = warn) still deploys it, production (strict)
      # refuses it.
      - name: Check signing secrets
        id: signing
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          if [ -n "$COSIGN_PRIVATE_KEY" ] && [ -n "$COSIGN_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Image not signed::Secrets COSIGN_PRIVATE_KEY / COSIGN_PASSWORD are not set in this repo — the image was pushed UNSIGNED. Staging (image_verification = warn) still deploys it; production (strict) refuses it."
          fi

      # cosign v3.1.3, pinned with its sha256 — the same binary the installs
      # verify with (devops self-hosted/terraform/scripts/install-cosign.sh;
      # move both together). A direct download instead of
      # sigstore/cosign-installer: no floating action tag to break the job.
      - name: Install cosign v3.1.3 (sha256 checked)
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/cosign \
            https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  /tmp/cosign" | sha256sum -c -
          sudo install -m 0755 /tmp/cosign /usr/local/bin/cosign
          rm -f /tmp/cosign
          cosign version | grep GitVersion

      - name: Sign image with cosign (by digest) and verify
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_REF: ${{ steps.ref.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_REF%:*}"   # image_ref carries the tag; sign <repo>@<digest>
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::the build step returned no digest ('$IMAGE_DIGEST') — nothing to sign"; exit 1; }
          # The key must be THE Norbix key: its public half = security/cosign.pub
          # (otherwise every install would reject the signature).
          if [ "$(cosign public-key --key env://COSIGN_PRIVATE_KEY | tr -d '[:space:]')" != "$(tr -d '[:space:]' < security/cosign.pub)" ]; then
            echo "::error::COSIGN_PRIVATE_KEY is not the Norbix key: its public half differs from security/cosign.pub (devops release/cosign.pub)"
            exit 1
          fi
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE_REF}@${IMAGE_DIGEST}"
          cosign verify --key security/cosign.pub "${IMAGE_REF}@${IMAGE_DIGEST}" > /dev/null
          echo "Signed and verified ${IMAGE_REF}@${IMAGE_DIGEST}"
          echo "- signed \`${IMAGE_REF}@${IMAGE_DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"

  notify-devops:
    name: Trigger staging deploy
    needs: [plan, build-push]
    runs-on: ubuntu-22.04
    steps:
      - name: Send repository_dispatch to devops
        env:
          TOKEN: ${{ secrets.DEVOPS_DISPATCH_TOKEN }}
        run: |
          # digest = what was pushed (and signed); devops records it and
          # deploys <repo>@<digest>
          PAYLOAD=$(jq -n \
            --arg r "${{ needs.plan.outputs.release }}" \
            --arg i "${{ needs.build-push.outputs.image_ref }}" \
            --arg d "${{ needs.build-push.outputs.digest }}" \
            --arg sha "${{ github.sha }}" --arg branch "${{ github.ref_name }}" \
            '{ event_type: "staging-deploy",
               client_payload: { release: $r, source: "admin", sha: $sha, branch: $branch,
                                 services: [ { name: "admin", image: $i, digest: $d } ] } }')
          echo "$PAYLOAD" | jq .

          # --http1.1 + retries handle transient network resets (curl 92).
          # We capture the HTTP status ourselves: 204 = accepted. Anything else
          # is printed with GitHub's answer, so token problems are visible.
          STATUS=$(curl -s --http1.1 --retry 5 --retry-delay 5 -o /tmp/dispatch-resp.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/codemash-io/devops/dispatches \
            -d "$PAYLOAD")
          if [ "$STATUS" != "204" ]; then
            echo "GitHub answered HTTP $STATUS:"; cat /tmp/dispatch-resp.txt
            echo "::error::Dispatch rejected (HTTP $STATUS). Check the DEVOPS_DISPATCH_TOKEN secret: not expired? access to the devops repo? permission Contents: Read and write?"
            exit 1
          fi
          echo "devops notified — watch codemash-io/devops → Actions → 'Staging · Deploy'"
